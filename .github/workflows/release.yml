name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          # macOS Intel
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          # macOS Universal (同时支持 Intel 和 Apple Silicon)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          # Linux x86_64
          - platform: "ubuntu-22.04"
            args: ""
          # Linux ARM64
          - platform: "ubuntu-24.04-arm"
            args: ""
          # Windows x86_64
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (contains(matrix.args, 'aarch64') && 'aarch64-unknown-linux-gnu' || '') }}

      - name: Node.js setup
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Validate updater signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Missing secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "Missing secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi

      - name: Sync versions
        run: npm run sync-version

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          VERSION="$(node -e "console.log(require(require('path').join(process.env.GITHUB_WORKSPACE, 'package.json')).version)")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.app_version.outputs.VERSION }}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag (${GITHUB_REF_NAME}) does not match package.json version (${EXPECTED_TAG})."
            exit 1
          fi

      - name: Build bilingual release notes from changelog
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.app_version.outputs.VERSION }}"

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^## / {
                if (capture) {
                  exit
                }
                if ($0 ~ ("^## \\[" version "\\][[:space:]]*-.*$") || $0 ~ ("^## \\[v" version "\\][[:space:]]*-.*$")) {
                  capture = 1
                  found = 1
                }
              }

              capture {
                if ($0 ~ /^---[[:space:]]*$/) {
                  exit
                }
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          if ! zh_section="$(extract_section CHANGELOG.zh-CN.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.zh-CN.md"
            exit 1
          fi

          if ! en_section="$(extract_section CHANGELOG.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi

          {
            echo "body<<EOF"
            echo "## 更新日志（中文）"
            echo
            printf '%s\n' "$zh_section"
            echo
            echo "## Changelog (English)"
            echo
            printf '%s\n' "$en_section"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Windows: Download Resource Hacker for metadata stripping
      - name: Download Resource Hacker (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "http://www.angusj.com/resourcehacker/resource_hacker.zip"
          $zipPath = "$env:RUNNER_TEMP\resource_hacker.zip"
          $extractPath = "$env:RUNNER_TEMP\resource_hacker"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          echo "RESHACKER_PATH=$extractPath\ResourceHacker.exe" >> $env:GITHUB_ENV

      # Non-Windows: Use tauri-action with auto-upload
      - name: Build the app (non-Windows)
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "v${{ steps.app_version.outputs.VERSION }}"
          releaseName: "SC-Cockpit Tools v${{ steps.app_version.outputs.VERSION }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          tauriScript: npx tauri

      # Windows: Manual multi-step build with metadata stripping
      # Step 1: Build frontend + compile exe (no installer bundling)
      - name: Build exe only (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: npx tauri build --no-bundle

      # Step 2: Strip exe metadata before MSI packaging
      - name: Strip exe metadata (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exePath = "src-tauri\target\release\cockpit-tools.exe"
          if (Test-Path $exePath) {
            Write-Host "[INFO] Stripping metadata from exe..."
            & $env:RESHACKER_PATH -open $exePath -save $exePath -action delete -mask "VERSIONINFO,,"
            Write-Host "[SUCCESS] Exe metadata stripped!"
          } else {
            Write-Host "[ERROR] Exe not found: $exePath"
            exit 1
          }

      # Step 3: Create MSI installer only (no recompile, uses stripped exe)
      - name: Create MSI installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: npx tauri bundle --bundles msi

      # Step 4: Strip MSI installer metadata (SummaryInformation stream)
      # Uses Windows Installer API via inline C# to clear metadata PIDs.
      - name: Strip MSI installer metadata (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $msiDir = "src-tauri\target\release\bundle\msi"
          $installers = Get-ChildItem -Path $msiDir -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Host "[ERROR] No MSI installer found in $msiDir"
            Get-ChildItem -Path $msiDir -ErrorAction SilentlyContinue
            exit 1
          }

          $csharpCode = 'using System;' + "`n"
          $csharpCode += 'using System.Runtime.InteropServices;' + "`n"
          $csharpCode += 'public class MsiMetadataStripper {' + "`n"
          $csharpCode += '    [DllImport("msi.dll", CharSet = CharSet.Unicode)]' + "`n"
          $csharpCode += '    private static extern uint MsiOpenDatabase(string szDatabasePath, IntPtr szPersist, out IntPtr phDatabase);' + "`n"
          $csharpCode += '    [DllImport("msi.dll")]' + "`n"
          $csharpCode += '    private static extern uint MsiGetSummaryInformation(IntPtr hDatabase, string szDatabasePath, uint uiUpdateCount, out IntPtr phSummaryInfo);' + "`n"
          $csharpCode += '    [DllImport("msi.dll", CharSet = CharSet.Unicode)]' + "`n"
          $csharpCode += '    private static extern uint MsiSummaryInfoSetProperty(IntPtr hSummaryInfo, uint uiProperty, uint uiDataType, int iValue, IntPtr pftValue, string szValue);' + "`n"
          $csharpCode += '    [DllImport("msi.dll")]' + "`n"
          $csharpCode += '    private static extern uint MsiSummaryInfoPersist(IntPtr hSummaryInfo);' + "`n"
          $csharpCode += '    [DllImport("msi.dll")]' + "`n"
          $csharpCode += '    private static extern uint MsiDatabaseCommit(IntPtr hDatabase);' + "`n"
          $csharpCode += '    [DllImport("msi.dll")]' + "`n"
          $csharpCode += '    private static extern uint MsiCloseHandle(IntPtr hAny);' + "`n"
          $csharpCode += '    private const uint VT_LPSTR = 30;' + "`n"
          $csharpCode += '    private static readonly uint[] STRING_PIDS = { 2, 3, 4, 5, 6, 8, 18 };' + "`n"
          $csharpCode += '    public static string Strip(string msiPath) {' + "`n"
          $csharpCode += '        IntPtr hDb = IntPtr.Zero;' + "`n"
          $csharpCode += '        IntPtr hSi = IntPtr.Zero;' + "`n"
          $csharpCode += '        try {' + "`n"
          $csharpCode += '            uint r = MsiOpenDatabase(msiPath, new IntPtr(1), out hDb);' + "`n"
          $csharpCode += '            if (r != 0) return "MsiOpenDatabase failed: " + r;' + "`n"
          $csharpCode += '            r = MsiGetSummaryInformation(hDb, null, 20, out hSi);' + "`n"
          $csharpCode += '            if (r != 0) return "MsiGetSummaryInformation failed: " + r;' + "`n"
          $csharpCode += '            foreach (uint pid in STRING_PIDS) {' + "`n"
          $csharpCode += '                MsiSummaryInfoSetProperty(hSi, pid, VT_LPSTR, 0, IntPtr.Zero, "");' + "`n"
          $csharpCode += '            }' + "`n"
          $csharpCode += '            r = MsiSummaryInfoPersist(hSi);' + "`n"
          $csharpCode += '            if (r != 0) return "MsiSummaryInfoPersist failed: " + r;' + "`n"
          $csharpCode += '            r = MsiDatabaseCommit(hDb);' + "`n"
          $csharpCode += '            if (r != 0) return "MsiDatabaseCommit failed: " + r;' + "`n"
          $csharpCode += '            return "OK";' + "`n"
          $csharpCode += '        } finally {' + "`n"
          $csharpCode += '            if (hSi != IntPtr.Zero) MsiCloseHandle(hSi);' + "`n"
          $csharpCode += '            if (hDb != IntPtr.Zero) MsiCloseHandle(hDb);' + "`n"
          $csharpCode += '        }' + "`n"
          $csharpCode += '    }' + "`n"
          $csharpCode += '}' + "`n"

          Add-Type -TypeDefinition $csharpCode -Language CSharp

          foreach ($installer in $installers) {
            Write-Host "[INFO] Stripping MSI SummaryInformation from $($installer.Name)..."
            $result = [MsiMetadataStripper]::Strip($installer.FullName)
            if ($result -ne "OK") {
              Write-Host "[ERROR] $result"
              exit 1
            }
            Write-Host "[SUCCESS] MSI metadata stripped from $($installer.Name)"
          }

      # Step 5: Create release and upload artifacts
      - name: Create Release (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.app_version.outputs.VERSION }}"
          name: "SC-Cockpit Tools v${{ steps.app_version.outputs.VERSION }}"
          body: ${{ steps.release_notes.outputs.body }}
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  rebuild-latest-json:
    name: Rebuild merged latest.json
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Node.js setup
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -e "console.log(require('./package.json').version)")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download release assets (retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          TAG="v${VERSION}"
          downloaded="false"
          for i in $(seq 1 30); do
            if gh release download "$TAG" --dir release-assets --pattern "*" --clobber; then
              downloaded="true"
              echo "Downloaded release assets from $TAG"
              break
            fi
            echo "Release assets not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          if [ "$downloaded" != "true" ]; then
            echo "Failed to download release assets from $TAG after retries."
            exit 1
          fi

      - name: Read release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" --json body --jq '.body' > release-notes.md
          PUBLISHED_AT="$(gh release view "v${VERSION}" --json publishedAt,createdAt --jq '.publishedAt // .createdAt')"
          if [ -z "${PUBLISHED_AT}" ] || [ "${PUBLISHED_AT}" = "null" ]; then
            PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          echo "PUBLISHED_AT=${PUBLISHED_AT}" >> "$GITHUB_ENV"

      - name: Build merged latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_merged_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-notes.md" \
            --published-at "${PUBLISHED_AT}" \
            --output "latest.json"

      - name: Validate merged latest.json
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .platforms["darwin-aarch64"] and
            .platforms["darwin-x86_64"] and
            .platforms["windows-x86_64"] and
            .platforms["windows-x86_64-msi"] and
            .platforms["linux-x86_64-appimage"] and
            .platforms["linux-aarch64-appimage"]
          ' latest.json > /dev/null
          jq -r '.platforms | keys[]' latest.json

      - name: Upload merged latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" latest.json --clobber

  upload-checksums:
    name: Upload SHA256SUMS
    needs:
      - release
      - rebuild-latest-json
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -e "console.log(require('./package.json').version)")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download release assets (retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          TAG="v${VERSION}"
          downloaded="false"
          for i in $(seq 1 30); do
            if gh release download "$TAG" --dir release-assets --pattern "*" --clobber; then
              downloaded="true"
              echo "Downloaded release assets from $TAG"
              break
            fi
            echo "Release assets not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          if [ "$downloaded" != "true" ]; then
            echo "Failed to download release assets from $TAG after retries."
            exit 1
          fi

      - name: Generate SHA256SUMS.txt from release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt
          find . -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                shasum -a 256 "$file"
              done \
            | sed 's#  \./#  #' \
            > ../SHA256SUMS.txt
          cd ..
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" SHA256SUMS.txt --clobber

  update-homebrew-cask:
    name: Update Homebrew Cask
    needs:
      - release
      - rebuild-latest-json
      - upload-checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Update the cask on main, not on the tag ref.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -e "console.log(require('./package.json').version)")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download universal DMG from GitHub Releases (retry)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Cockpit.Tools_${VERSION}_universal.dmg"
          echo "Downloading: $URL"
          for i in $(seq 1 30); do
            if curl -fL --retry 3 --retry-delay 1 -o cockpit-tools.dmg "$URL"; then
              exit 0
            fi
            echo "Asset not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          echo "Failed to download release asset after retries."
          exit 1

      - name: Compute sha256
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(sha256sum cockpit-tools.dmg | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Update Cask file
        shell: bash
        run: |
          set -euo pipefail
          FILE="Casks/cockpit-tools.rb"
          if [ ! -f "$FILE" ]; then
            echo "Missing $FILE. Create it first."
            exit 1
          fi

          perl -0777 -i -pe \
            's/version \"[^\"]+\"/version \"'"$VERSION"'\"/; s/sha256 \"[0-9a-f]{64}\"/sha256 \"'"$SHA256"'\"/' \
            "$FILE"

          git diff -- "$FILE"

      - name: Create pull request
        id: create_cask_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(homebrew): update cask for v${{ env.VERSION }}"
          title: "chore(homebrew): update cask for v${{ env.VERSION }}"
          body: |
            Auto-generated by the release workflow.

            - version: ${{ env.VERSION }}
            - sha256 (universal.dmg): ${{ env.SHA256 }}
          branch: "automation/update-cask-v${{ env.VERSION }}"
          base: main
          delete-branch: true

      - name: Enable auto-merge for cask PR
        if: ${{ steps.create_cask_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.create_cask_pr.outputs.pull-request-number }}"
          PR_BRANCH="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          if [[ "$PR_BRANCH" != automation/update-cask-v* ]]; then
            echo "Unexpected PR branch: $PR_BRANCH"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

  publish-release:
    name: Publish release as latest
    needs:
      - release
      - rebuild-latest-json
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -e "console.log(require('./package.json').version)")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false --latest
